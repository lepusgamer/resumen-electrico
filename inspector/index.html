<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1d2c">
<title>Asistente Inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #f3f5f8; --surface: #ffffff; --sunken: #eef2f6; --ink: #101924; --muted: #5b6876; --line: #dfe5ec;
  --accent: #1d5cc0; --accent-ink: #ffffff; --accent-soft: rgba(29,92,192,.10);
  --bad: #c8372d; --bad-soft: rgba(200,55,45,.10);
  --warn: #a96500; --warn-soft: rgba(214,140,20,.14);
  --ok: #16804a; --ok-soft: rgba(22,128,74,.11);
  --bar: #0f1d2c; --bar-ink: #eaf0f5; --bar-muted: #93a6b8; --bar-line: rgba(255,255,255,.10);
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 2px 8px rgba(16,24,40,.05);
  --shadow-hover: 0 2px 4px rgba(16,24,40,.06), 0 8px 20px rgba(16,24,40,.08);
  --shadow-lg: 0 16px 40px rgba(16,24,40,.22);
  --f-display: "Saira Condensed", "Arial Narrow", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1117; --surface: #131c25; --sunken: #1a2530; --ink: #e4ebf1; --muted: #93a4b3; --line: #253340;
    --accent: #74a9ff; --accent-ink: #0b1117; --accent-soft: rgba(116,169,255,.14);
    --bad: #ff7a6e; --bad-soft: rgba(255,122,110,.14); --warn: #f0b052; --warn-soft: rgba(240,176,82,.14);
    --ok: #52d08f; --ok-soft: rgba(82,208,143,.14); --bar: #080e14; --bar-line: rgba(255,255,255,.07);
    --shadow: 0 1px 0 rgba(0,0,0,.35); --shadow-hover: 0 4px 16px rgba(0,0,0,.4); --shadow-lg: 0 16px 40px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1117; --surface: #131c25; --sunken: #1a2530; --ink: #e4ebf1; --muted: #93a4b3; --line: #253340;
  --accent: #74a9ff; --accent-ink: #0b1117; --accent-soft: rgba(116,169,255,.14);
  --bad: #ff7a6e; --bad-soft: rgba(255,122,110,.14); --warn: #f0b052; --warn-soft: rgba(240,176,82,.14);
  --ok: #52d08f; --ok-soft: rgba(82,208,143,.14); --bar: #080e14; --bar-line: rgba(255,255,255,.07);
  --shadow: 0 1px 0 rgba(0,0,0,.35); --shadow-hover: 0 4px 16px rgba(0,0,0,.4); --shadow-lg: 0 16px 40px rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body); padding-bottom: 96px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right)); }
.i { width: 18px; height: 18px; flex: none; }
.i.sm { width: 15px; height: 15px; }
.i.lg { width: 22px; height: 22px; }

/* ---------- Barra superior ---------- */
.appbar { background: var(--bar); color: var(--bar-ink); position: sticky; top: 0; z-index: 20; }
.appbar .wrap { display: flex; align-items: center; gap: 14px; min-height: 64px; }
.logo { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(145deg, #2f74e0, #1a4fa8); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.2); flex: none; }
.brand h1 { font: 700 1.35rem/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
.brand small { color: var(--bar-muted); font-size: .78rem; }
.appbar .tabs { display: flex; gap: 2px; margin-left: 20px; }
.appbar .tabs button { position: relative; display: flex; align-items: center; gap: 7px; border: 0; background: none; color: var(--bar-muted); padding: 8px 12px; border-radius: 9px; cursor: pointer; font: 600 .98rem var(--f-display); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.appbar .tabs button:hover { color: var(--bar-ink); background: var(--bar-line); }
.appbar .tabs button[aria-selected="true"] { color: #fff; background: rgba(116,169,255,.18); }
.appbar .tabs button[aria-selected="true"] .i { color: #8db8ff; }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: #e5483c; color: #fff; font: 700 .7rem/18px var(--f-body); text-align: center; letter-spacing: 0; }
.appbar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.clock { font: 600 .95rem var(--f-mono); color: var(--bar-ink); background: var(--bar-line); padding: 5px 10px; border-radius: 8px; }
.iconbtn { width: 36px; height: 36px; border-radius: 9px; border: 0; background: var(--bar-line); color: var(--bar-ink); display: grid; place-items: center; cursor: pointer; }
.iconbtn:hover { background: rgba(255,255,255,.18); }
@media (max-width: 860px) {
  .appbar .tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; padding: 6px 4px max(6px, env(safe-area-inset-bottom)); z-index: 30; box-shadow: 0 -4px 16px rgba(0,0,0,.06); }
  .appbar .tabs button { flex-direction: column; gap: 2px; font-size: .72rem; padding: 6px 4px; color: var(--muted); flex: 1; }
  .appbar .tabs button:hover { background: none; color: var(--ink); }
  .appbar .tabs button[aria-selected="true"] { background: none; color: var(--accent); }
  .appbar .tabs button[aria-selected="true"] .i { color: var(--accent); }
  .appbar .tabs .badge { position: absolute; top: 0; left: calc(50% + 6px); }
  .appbar .tabs .i { width: 22px; height: 22px; }
}
@media (max-width: 420px) { .brand small { display: none; } .clock { display: none; } }

/* ---------- Tipografía y estructura ---------- */
main { padding-top: 20px; }
.hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.hero h2 { font: 700 2rem/1.05 var(--f-display); margin: 0; letter-spacing: .01em; }
.hero p { margin: 4px 0 0; color: var(--muted); }
.hero p b { color: var(--ink); }
.sec { display: flex; align-items: center; gap: 8px; margin: 28px 0 12px; }
.sec h3 { font: 700 1.15rem/1.2 var(--f-display); text-transform: uppercase; letter-spacing: .05em; margin: 0; }
.sec .count { font: 700 .75rem/1 var(--f-body); background: var(--sunken); color: var(--muted); padding: 4px 8px; border-radius: 99px; }
.sec .spacer { flex: 1; }
.cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 0 24px; align-items: start; }
@media (max-width: 960px) { .cols { grid-template-columns: 1fr; } }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }
.list { display: grid; gap: 10px; }
.note { color: var(--muted); font-size: .88rem; }
[hidden] { display: none !important; }

/* ---------- Botones ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: .9rem; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; color: var(--ink); transition: border-color .15s, background .15s, transform .1s; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 5px 10px; font-size: .8rem; border-radius: 8px; gap: 5px; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.go { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn.go:hover { background: var(--accent); color: var(--accent-ink); }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 960px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpis .kpi:first-child { grid-column: 1 / -1; } }
.kpi { --k: var(--accent); --ks: var(--accent-soft); position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; cursor: pointer; text-align: left; display: grid; grid-template-columns: 1fr auto; align-items: start; box-shadow: var(--shadow); transition: box-shadow .15s, transform .15s; }
.kpi:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
.kpi::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--k); }
.kpi b { display: block; font: 700 2.4rem/1 var(--f-display); color: var(--ink); }
.kpi span { color: var(--muted); font-size: .84rem; font-weight: 700; }
.kpi .ki { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--ks); color: var(--k); }
.kpi.bad { --k: var(--bad); --ks: var(--bad-soft); } .kpi.bad b { color: var(--bad); }
.kpi.warn { --k: var(--warn); --ks: var(--warn-soft); }
.kpi.ok { --k: var(--ok); --ks: var(--ok-soft); }
.kpi.zero b { color: var(--muted); }

/* ---------- Alertas ---------- */
.agroup { margin-bottom: 14px; }
.agroup > .lbl { display: flex; align-items: center; gap: 6px; font: 700 .75rem var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px 2px; }
.agroup > .lbl::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.alert { --c: var(--accent); --cs: var(--accent-soft); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; box-shadow: var(--shadow); transition: box-shadow .15s; }
.alert:hover { box-shadow: var(--shadow-hover); }
.alert .ai { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--cs); color: var(--c); }
.alert .at { font-weight: 700; line-height: 1.3; }
.alert .at .n { font-family: var(--f-mono); font-weight: 600; font-size: .88rem; color: var(--c); margin-right: 4px; }
.alert small { color: var(--muted); display: block; font-size: .83rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bad { --c: var(--bad); --cs: var(--bad-soft); }
.warn { --c: var(--warn); --cs: var(--warn-soft); }
.info { --c: var(--accent); --cs: var(--accent-soft); }
.okc { --c: var(--ok); --cs: var(--ok-soft); }
.allgood { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: var(--r); background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.allgood .i { width: 28px; height: 28px; }

/* ---------- Tarjeta OT ---------- */
.ot { --b: var(--line); position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 14px 20px; cursor: pointer; box-shadow: var(--shadow); transition: box-shadow .15s, transform .15s; overflow: hidden; }
.ot:hover { box-shadow: var(--shadow-hover); }
.ot::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--b); }
.ot-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ot .num { font: 600 .9rem var(--f-mono); color: var(--muted); margin-right: 2px; }
.ot .desc { font-weight: 700; font-size: 1.02rem; line-height: 1.35; margin: 6px 0 8px; }
.ot-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.meta { color: var(--muted); font-size: .85rem; display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: center; }
.meta > span { display: inline-flex; align-items: center; gap: 5px; }
.av { width: 22px; height: 22px; border-radius: 50%; background: var(--b); color: #fff; display: inline-grid; place-items: center; font: 700 .62rem var(--f-body); letter-spacing: -.02em; flex: none; }
.av.lg { width: 44px; height: 44px; font-size: .95rem; border-radius: 13px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: .74rem; font-weight: 700; white-space: nowrap; line-height: 1.5; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-planificada { background: var(--accent-soft); color: var(--accent); }
.st-ejecucion { background: var(--ok-soft); color: var(--ok); }
.st-detenida { background: var(--warn-soft); color: var(--warn); }
.st-terminada { background: rgba(138,79,208,.13); color: #8a4fd0; }
.st-recepcionada { background: var(--sunken); color: var(--muted); }
:root[data-theme="dark"] .st-terminada { color: #b88cf0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .st-terminada { color: #b88cf0; } }
.prio { font: 700 .7rem var(--f-body); text-transform: uppercase; letter-spacing: .06em; padding: 2px 7px; border-radius: 6px; border: 1px solid; }
.pr-alta { color: var(--bad); border-color: currentColor; }
.pr-media { color: var(--warn); border-color: currentColor; opacity: .85; }
.pr-baja { color: var(--muted); border-color: var(--line); }
.due { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font: 700 .8rem var(--f-body); padding: 4px 10px; border-radius: 8px; background: var(--cs, var(--sunken)); color: var(--c, var(--muted)); white-space: nowrap; }
.due.muted { --c: var(--muted); --cs: var(--sunken); }
.bar { flex: 1; height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.pct { font: 600 .78rem var(--f-mono); color: var(--muted); min-width: 34px; text-align: right; }
.ot-foot .btn { margin-left: auto; }

/* ---------- Agenda ---------- */
.agenda { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.agenda .dayh { display: flex; align-items: baseline; gap: 10px; padding: 10px 16px; background: var(--sunken); font: 700 .95rem var(--f-display); text-transform: uppercase; letter-spacing: .05em; }
.agenda .dayh small { font: 400 .8rem var(--f-body); color: var(--muted); text-transform: none; letter-spacing: 0; }
.agenda .it { --b: var(--line); display: grid; grid-template-columns: 52px 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.agenda .it:hover { background: var(--sunken); }
.agenda .t { font: 600 .85rem var(--f-mono); }
.agenda .ln { align-self: stretch; border-radius: 2px; background: var(--b); }
.agenda .it b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agenda .it small { color: var(--muted); }

.empty { color: var(--muted); padding: 28px 16px; text-align: center; border: 1.5px dashed var(--line); border-radius: var(--r); display: grid; place-items: center; gap: 6px; }
.empty .i { width: 28px; height: 28px; opacity: .6; }

/* ---------- Filtros ---------- */
.toolbar { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
@media (max-width: 760px) { .toolbar { grid-template-columns: 1fr 1fr; } .toolbar .search { grid-column: 1 / -1; } }
.search { position: relative; }
.search .i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { padding-left: 38px; }
input, select, textarea { font-weight: 400; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; min-width: 0; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; }
label { display: grid; gap: 5px; font-size: .8rem; color: var(--muted); font-weight: 700; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
.chipbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 12px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .85rem; }
.fchip button { border: 0; background: var(--accent); color: var(--accent-ink); width: 20px; height: 20px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; padding: 0; }

/* ---------- Calendario ---------- */
.calhead { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.calhead .title { font: 700 1.7rem/1 var(--f-display); min-width: 200px; }
.calhead select { width: auto; }
.calwrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal .dow { text-align: center; font: 700 .75rem var(--f-body); text-transform: uppercase; letter-spacing: .08em; padding: 10px 4px; color: var(--muted); border-bottom: 1px solid var(--line); }
.cal .day { background: transparent; min-height: 112px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; overflow: hidden; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; transition: background .12s; }
.cal .day:nth-child(7n) { border-right: 0; }
.cal .day:hover { background: var(--sunken); }
.cal .day.out { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--sunken) 6px 7px); }
.cal .day.out .dn { color: var(--muted); opacity: .6; }
.cal .day.we:not(.out) { background: color-mix(in srgb, var(--sunken) 55%, transparent); }
.cal .dn { font: 600 .82rem var(--f-mono); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; margin-bottom: 2px; }
.cal .day.today .dn { background: var(--accent); color: var(--accent-ink); }
.cal .day.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.chip { --b: #7a8791; display: flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 700; line-height: 1.35; padding: 2px 6px 2px 5px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); background: color-mix(in srgb, var(--b) 16%, var(--surface)); border-left: 3px solid var(--b); }
.chip .x { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); flex: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--bad) 30%, transparent); }
.chip span { overflow: hidden; text-overflow: ellipsis; }
.more { font-size: .72rem; color: var(--muted); font-weight: 700; padding-left: 4px; }
@media (max-width: 640px) {
  .cal .day { min-height: 58px; flex-direction: row; flex-wrap: wrap; align-content: flex-start; gap: 3px; padding: 4px; }
  .cal .dn { width: 100%; height: 22px; border-radius: 6px; }
  .cal .day.today .dn { width: 22px; border-radius: 50%; }
  .chip { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: var(--b); font-size: 0; }
  .chip .x, .chip span { display: none; }
  .more { display: none; }
  .calhead .title { font-size: 1.4rem; min-width: 0; flex: 1; }
}
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: .84rem; margin: 12px 2px 0; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }

/* ---------- Brigadas ---------- */
.loadwrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; overflow-x: auto; }
.load { display: grid; grid-template-columns: minmax(120px, 190px) repeat(14, minmax(28px, 1fr)); gap: 4px; font-size: .75rem; align-items: stretch; min-width: 560px; }
.load .h { text-align: center; color: var(--muted); font: 600 .7rem/1.25 var(--f-mono); padding-bottom: 4px; }
.load .h b { display: block; font-size: .85rem; color: var(--ink); }
.load .h.we b { color: var(--bad); }
.load .h.tod b { color: var(--accent); }
.load .name { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .85rem; }
.load .c { border-radius: 7px; background: var(--sunken); display: grid; place-items: center; font: 700 .75rem var(--f-mono); min-height: 32px; }
.load .c.n1 { background: color-mix(in srgb, var(--b) 75%, var(--surface)); color: #fff; }
.load .c.n2 { background: var(--bad); color: #fff; box-shadow: 0 0 0 2px var(--bad-soft); }
.bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
@media (max-width: 400px) { .bgrid { grid-template-columns: 1fr; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; align-content: start; }
.panel .ph { display: flex; gap: 12px; align-items: center; }
.panel .ph .ai { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--cs); color: var(--c); }

/* ---------- Bienvenida ---------- */
.welcome { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 28px; display: grid; gap: 18px; max-width: 760px; }

dialog { border: 0; border-radius: 18px; padding: 0; width: min(720px, calc(100vw - 20px)); max-height: calc(100dvh - 20px); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-lg); }

.dh h3 small { display: block; font: 400 .82rem var(--f-body); color: var(--muted); }
.db { padding: 18px 20px; overflow-y: auto; display: grid; gap: 14px; }

.fs { display: grid; gap: 12px; }
.fs > .lt { font: 700 .75rem var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.fs > .lt::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.closex { width: 34px; height: 34px; border-radius: 9px; border: 0; background: var(--sunken); display: grid; place-items: center; cursor: pointer; color: var(--muted); }

.log div { position: relative; font-size: .88rem; padding: 0 0 12px 20px; }
.log div::before { content: ""; position: absolute; left: 4px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 10px); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-weight: 700; z-index: 60; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100vw - 32px); display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow-lg); }

<script>
"use strict";
/* ======================= Iconos ======================= */
const IC = {

  sun: "M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",

  bolt: "M13 2 3 14h9l-1 8 10-12h-9z",
  down: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3",
  up: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12",
  db: "M12 8c4.4 0 8-1.3 8-3s-3.6-3-8-3-8 1.3-8 3 3.6 3 8 3zM4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3",
  trash: "M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15",
  copy: "M9 9h11v11H9zM5 15H4V4h11v1",

  sheet: "M4 3h16v18H4zM4 9h16M4 15h16M10 3v18",
};
const ic = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
function hydrateIcons(root = document) { root.querySelectorAll("[data-ic]").forEach(el => { el.outerHTML = ic(el.dataset.ic, el.className); }); }

/* ======================= Datos ======================= */
const KEY = "inspector-mant-v1";
const ESTADOS = [
  ["planificada", "Planificada"], ["ejecucion", "En ejecución"], ["detenida", "Detenida"],
  ["terminada", "Terminada (por recepcionar)"], ["recepcionada", "Recepcionada / cerrada"]
];
const EST_LABEL = Object.fromEntries(ESTADOS.map(([k, v]) => [k, v.replace(/ \(.*/, "")]));
const ACTIVA = e => e === "planificada" || e === "ejecucion" || e === "detenida";
const COLORS = ["#2563c9", "#d0433a", "#1e9257", "#8a4fd0", "#d07a12", "#0f8a94", "#c03a86", "#5f7330"];
const DEF_AJUSTES = { horasVence: 24, diasInicio: 2, diasRecepcion: 2, notif: false };

let S = load();
function blank() { return { brigadas: [], ots: [], ajustes: { ...DEF_AJUSTES }, avisados: {} }; }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); d.ajustes = { ...DEF_AJUSTES, ...(d.ajustes || {}) }; d.avisados = d.avisados || {}; return d; }
  } catch (e) {}
  return blank();
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch (e) { toast("No se pudo guardar en este navegador. Exporta un respaldo."); return false; }
}
function save() { persist(); renderAll(); }
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const brigById = id => S.brigadas.find(b => b.id === id);
const otById = id => S.ots.find(o => o.id === id);

/* ======================= Utilidades ======================= */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const D = s => s ? new Date(s) : null;
const pad = n => String(n).padStart(2, "0");
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const fmtDT = new Intl.DateTimeFormat("es-CL", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false });
const fmtD = new Intl.DateTimeFormat("es-CL", { weekday: "short", day: "numeric", month: "short" });
const fmtLong = new Intl.DateTimeFormat("es-CL", { weekday: "long", day: "numeric", month: "long" });
const fmtMonth = new Intl.DateTimeFormat("es-CL", { month: "long", year: "numeric" });
const fmtHM = new Intl.DateTimeFormat("es-CL", { hour: "2-digit", minute: "2-digit", hour12: false });
const fdt = s => s ? fmtDT.format(D(s)) : "—";
function fRange(a, b) {
  if (!a) return "Sin fecha";
  const A = D(a), B = D(b);
  if (B && dayKey(A) === dayKey(B)) return `${fmtD.format(A)} · ${fmtHM.format(A)}–${fmtHM.format(B)}`;
  return `${fdt(a)} → ${fdt(b)}`;
}
function dur(ms) {
  ms = Math.abs(ms); const m = Math.round(ms / 60000);
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60); if (h < 48) return `${h} h${m % 60 && h < 6 ? " " + (m % 60) + " min" : ""}`;
  const d = Math.floor(h / 24), rh = h % 24; return `${d} d${rh ? " " + rh + " h" : ""}`;
}
function toast(msg) { const t = document.getElementById("toast"); t.innerHTML = ic("checkc") + esc(msg); t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }
const sectores = () => [...new Set(S.ots.map(o => (o.sector || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
function overlaps(o, a, b) { const s = D(o.inicioPlan), e = D(o.finPlan) || s; return s && s < b && e >= a; }
function initials(name) {
  name = String(name || "").trim(); if (!name) return "?";
  const num = name.match(/\d+/);
  const w = name.split(/\s+/).filter(x => /^[\p{L}]/u.test(x));
  return ((w[0]?.[0] || "") + (num ? num[0] : (w[1]?.[0] || ""))).toUpperCase().slice(0, 3);
}
const bColor = id => brigById(id)?.color || "#7a8791";

/* ======================= Alertas ======================= */
const KIND_IC = { atrasada: "alert", vence: "clock", noinicia: "play", inicia: "arrow", detenida: "pause", recepcion: "check", choque: "swap" };
function alertas(now = new Date()) {
  const A = [], aj = S.ajustes, H = 3600e3;
  for (const o of S.ots) {
    const ini = D(o.inicioPlan), fin = D(o.finPlan), b = brigById(o.brigadaId);
    const base = { ot: o, who: b ? b.nombre : "Sin brigada" };
    if (ACTIVA(o.estado) && fin && fin < now)
      A.push({ ...base, sev: "bad", k: "atrasada", t: `Atrasada ${dur(now - fin)}`, sub: `Debía terminar ${fdt(o.finPlan)}`, when: -1e15 + fin.getTime() });
    else if (ACTIVA(o.estado) && fin && fin - now <= aj.horasVence * H)
      A.push({ ...base, sev: "warn", k: "vence", t: `Vence en ${dur(fin - now)}`, sub: `Término plan ${fdt(o.finPlan)}`, when: fin.getTime() });
    if (o.estado === "planificada" && ini && ini < now)
      A.push({ ...base, sev: "bad", k: "noinicia", t: `Sin iniciar · debió hace ${dur(now - ini)}`, sub: `Inicio plan ${fdt(o.inicioPlan)}`, when: -1e15 + ini.getTime() });
    else if (o.estado === "planificada" && ini && ini - now <= aj.diasInicio * 24 * H)
      A.push({ ...base, sev: "info", k: "inicia", t: `Inicia en ${dur(ini - now)}`, sub: `Inicio plan ${fdt(o.inicioPlan)}`, when: ini.getTime() });
    if (o.estado === "detenida") {
      const last = (o.bitacora || []).slice(-1)[0];
      A.push({ ...base, sev: "warn", k: "detenida", t: "Trabajo detenido", sub: last ? last.txt : "Registra el motivo en la bitácora", when: 0 });
    }
    if (o.estado === "terminada") {
      const f = D(o.finReal) || fin; const late = f && now - f > aj.diasRecepcion * 24 * H;
      A.push({ ...base, sev: late ? "warn" : "info", k: "recepcion", t: late ? `Sin recepcionar hace ${dur(now - f)}` : "Pendiente de recepción", sub: "Revisar en terreno y cerrar OT", when: 1e15 });
    }
  }
  for (const b of S.brigadas) {
    const act = S.ots.filter(o => o.brigadaId === b.id && ACTIVA(o.estado) && o.inicioPlan && o.finPlan)
      .sort((x, y) => D(x.inicioPlan) - D(y.inicioPlan));
    for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
      if (D(act[j].inicioPlan) < D(act[i].finPlan) && D(act[i].finPlan) > now)
        A.push({ ot: act[j], who: b.nombre, sev: "warn", k: "choque", key: "choque-" + act[i].id, t: `Choque con OT ${act[i].numero}`, sub: `${b.nombre} tiene dos trabajos a la vez`, when: D(act[j].inicioPlan).getTime() });
    }
  }
  const rank = { bad: 0, warn: 1, info: 2 };
  return A.sort((a, b) => rank[a.sev] - rank[b.sev] || a.when - b.when);
}

/* ======================= Componentes ======================= */
function dueInfo(o, now = new Date()) {
  const ini = D(o.inicioPlan), fin = D(o.finPlan);
  if (o.estado === "recepcionada") return ["muted", "check", "Cerrada"];
  if (o.estado === "terminada") return ["info", "check", "Por recepcionar"];
  if (fin && fin < now) return ["bad", "alert", "Atrasada " + dur(now - fin)];
  if (o.estado === "planificada" && ini && ini < now) return ["bad", "play", "Sin iniciar"];
  if (o.estado === "planificada" && ini) return ["info", "arrow", "Inicia en " + dur(ini - now)];
  if (fin) return [fin - now <= S.ajustes.horasVence * 3600e3 ? "warn" : "muted", "clock", "Quedan " + dur(fin - now)];
  return ["muted", "clock", "Sin fecha"];
}
function quickBtn(o) {
  const m = { planificada: ["ejecucion", "Iniciar", "play"], ejecucion: ["terminada", "Terminar", "check"], detenida: ["ejecucion", "Reanudar", "play"], terminada: ["recepcionada", "Recepcionar", "checkc"] }[o.estado];
  return m ? `<button class="btn small go" data-quick="${o.id}" data-to="${m[0]}">${ic(m[2], "sm")}${m[1]}</button>` : "";
}
function otCard(o) {
  const b = brigById(o.brigadaId);
  const av = Number(o.avance) || 0;
  const [dc, di, dt] = dueInfo(o);

function renderHoy() {
  const now = new Date(), A = alertas(now);
  const act = S.ots.filter(o => ACTIVA(o.estado));
  const t0 = startOfDay(now), t1 = addDays(t0, 1);
  const hoy = act.filter(o => overlaps(o, t0, t1));
  const prox = act.filter(o => D(o.inicioPlan) >= t1 && D(o.inicioPlan) < addDays(t0, 8)).sort((a, b) => D(a.inicioPlan) - D(b.inicioPlan));
  const n = k => A.filter(a => a.k === k).length;
  const el = document.getElementById("v-hoy");
  if (!S.ots.length && !S.brigadas.length) {
    el.innerHTML = `<div class="welcome">
      <div><h2>Bienvenido, inspector</h2><p class="note" style="margin:6px 0 0">Controla las OT de tus brigadas contratistas: sector, fechas, estado y avance, con alertas automáticas.</p></div>
      <div class="steps">
        <div class="step info"><span class="ai">${ic("users")}</span><div><b>Crea tus brigadas</b><div class="note">Empresa, supervisor y teléfono para llamar o enviar WhatsApp.</div></div></div>
        <div class="step okc"><span class="ai">${ic("list")}</span><div><b>Ingresa las OT</b><div class="note">Una por una con el botón «Nueva OT», o pegándolas desde Excel.</div></div></div>
        <div class="step warn"><span class="ai">${ic("bell")}</span><div><b>Recibe avisos</b><div class="note">Atrasos, vencimientos, inicios y choques de horario. Exporta todo a tu calendario.</div></div></div>
      </div>
      <div class="row"><button class="btn primary" id="demoBtn">${ic("bolt", "sm")}Probar con datos de ejemplo</button><button class="btn" data-go="brig">${ic("users", "sm")}Crear brigadas</button></div></div>`;
    return;
  }
  const crit = n("atrasada") + n("noinicia");
  const hr = now.getHours(), saludo = hr < 12 ? "Buenos días" : hr < 20 ? "Buenas tardes" : "Buenas noches";
  const resumen = crit || n("vence")
    ? `Tienes ${crit ? `<b>${crit} OT ${crit === 1 ? "crítica" : "críticas"}</b>` : ""}${crit && n("vence") ? " y " : ""}${n("vence") ? `<b>${n("vence")} por vencer</b>` : ""}. ${hoy.length} trabajos en terreno hoy.`
    : `Todo al día. ${hoy.length} trabajos en terreno hoy.`;
  const kpi = (cls, f, val, label, icon) => `<button class="kpi ${cls}${val ? "" : " zero"}" data-filter="${f}"><div><b>${val}</b><span>${label}</span></div><span class="ki">${ic(icon)}</span></button>`;
  const groups = [["bad", "Crítico"], ["warn", "Atención"], ["info", "Próximo"]].map(([s, l]) => {
    const g = A.filter(a => a.sev === s);
    return g.length ? `<div class="agroup ${s}"><div class="lbl">${l} · ${g.length}</div><div class="list">${g.map(alertRow).join("")}</div></div>` : "";
  }).join("");
  // Agenda próximos días
  const byDay = {};
  for (const o of prox) (byDay[dayKey(D(o.inicioPlan))] ||= []).push(o);
  const agenda = Object.entries(byDay).map(([k, L]) => {
    const d = D(k + "T00:00");
    return `<div class="dayh">${cap(fmtD.format(d))}<small>${L.length} OT</small></div>` + L.map(o => {
      const b = brigById(o.brigadaId);
      return `<div class="it" data-ot="${o.id}" tabindex="0" role="button" style="--b:${esc(bColor(o.brigadaId))}"><span class="t">${fmtHM.format(D(o.inicioPlan))}</span><span class="ln"></span>
        <div style="min-width:0"><b>${esc(o.descripcion) || "OT " + esc(o.numero)}</b><small>OT ${esc(o.numero)} · ${esc(o.sector || "—")} · ${esc(b?.nombre || "Sin brigada")}</small></div>
        ${o.prioridad === "alta" ? `<span class="prio pr-alta">alta</span>` : ""}</div>`;
    }).join("");
  }).join("");
  el.innerHTML = `
    <div class="hero"><div><h2>${saludo}</h2><p>${cap(fmtLong.format(now))} · ${resumen}</p></div></div>
    <div class="kpis">
      ${kpi("", "activas", act.length, "OT activas", "list")}
      ${kpi("ok", "ejecucion", act.filter(o => o.estado === "ejecucion").length, "En ejecución", "bolt")}
      ${kpi("bad", "atrasadas", crit, "Atrasadas / sin iniciar", "alert")}
      ${kpi("warn", "vence", n("vence"), `Vencen en ≤ ${S.ajustes.horasVence} h`, "clock")}
      ${kpi("", "terminada", n("recepcion"), "Por recepcionar", "checkc")}
    </div>
    <div class="cols">
      <div>
        <div class="sec"><h3>Alertas</h3><span class="count">${A.length}</span></div>
        ${A.length ? groups : `<div class="allgood">${ic("checkc")}Sin alertas. Todo en orden.</div>`}
      </div>
      <div>
        <div class="sec"><h3>En terreno hoy</h3><span class="count">${hoy.length}</span></div>
        <div class="list">${hoy.length ? hoy.sort((a, b) => (brigById(a.brigadaId)?.nombre || "").localeCompare(brigById(b.brigadaId)?.nombre || "")).map(otCard).join("") : emptyBox("cal", "No hay OT planificadas para hoy.")}</div>
        <div class="sec"><h3>Próximos 7 días</h3><span class="count">${prox.length}</span></div>
        ${prox.length ? `<div class="agenda">${agenda}</div>` : emptyBox("cal", "Nada programado.")}
      </div>
    </div>`;
}

let otPreset = null;
function fillFilters() {
  const keep = id => document.getElementById(id).value;
  const fe = keep("fEstado"), fb = keep("fBrig"), fs = keep("fSector");
  document.getElementById("fEstado").innerHTML = `<option value="">Activas + por recepcionar</option><option value="todas">Todos los estados</option>` + ESTADOS.map(([k, v]) => `<option value="${k}">${v}</option>`).join("");

  document.getElementById("fSector").innerHTML = `<option value="">Todos los sectores</option>` + sectores().map(s => `<option>${esc(s)}</option>`).join("");
  document.getElementById("fEstado").value = fe; document.getElementById("fBrig").value = fb; document.getElementById("fSector").value = fs;
  document.getElementById("calBrig").innerHTML = `<option value="">Todas las brigadas</option>` + S.brigadas.map(b => `<option value="${b.id}">${esc(b.nombre)}</option>`).join("");
  document.getElementById("calBrig").value = calBrig;
}
function renderOTs() {
  const q = document.getElementById("fText").value.trim().toLowerCase();
  const fe = document.getElementById("fEstado").value, fb = document.getElementById("fBrig").value, fs = document.getElementById("fSector").value;
  const now = new Date();
  const L = S.ots.filter(o => {
    if (fe === "" && o.estado === "recepcionada") return false;
    if (fe && fe !== "todas" && o.estado !== fe) return false;
    if (fb === "_none" ? o.brigadaId : fb && o.brigadaId !== fb) return false;
    if (fs && (o.sector || "").trim() !== fs) return false;
    if (q && !`${o.numero} ${o.descripcion} ${o.sector} ${brigById(o.brigadaId)?.nombre || ""} ${o.notas || ""}`.toLowerCase().includes(q)) return false;
    if (otPreset === "atrasadas") return ACTIVA(o.estado) && ((D(o.finPlan) && D(o.finPlan) < now) || (o.estado === "planificada" && D(o.inicioPlan) < now));
    if (otPreset === "vence") return ACTIVA(o.estado) && D(o.finPlan) >= now && D(o.finPlan) - now <= S.ajustes.horasVence * 3600e3;
    if (otPreset === "activas") return ACTIVA(o.estado);
    return true;
  }).sort((a, b) => (D(a.finPlan) || 0) - (D(b.finPlan) || 0));
  const presetName = { atrasadas: "Atrasadas / sin iniciar", vence: `Vencen en ≤ ${S.ajustes.horasVence} h`, activas: "Solo activas" }[otPreset];
  document.getElementById("otSub").textContent = `${L.length} de ${S.ots.length} OT · ordenadas por fecha de término`;
  document.getElementById("otList").innerHTML =
    (presetName ? `<div class="chipbar"><span class="fchip">${presetName}<button id="clearPreset" aria-label="Quitar filtro">${ic("x", "sm")}</button></span></div>` : "") +
    (L.length ? L.map(otCard).join("") : emptyBox("search", "No hay OT con estos filtros."));
}

/* ======================= Calendario ======================= */
let calMonth = startOfDay(new Date()); calMonth.setDate(1);
let calSel = startOfDay(new Date()); let calBrig = "";
function calOTs() { return S.ots.filter(o => o.estado !== "recepcionada" && (!calBrig || o.brigadaId === calBrig)); }
function renderCal() {
  const now = new Date(), y = calMonth.getFullYear(), m = calMonth.getMonth();
  document.getElementById("calTitle").textContent = cap(fmtMonth.format(calMonth));
  const first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, start = addDays(first, -off);
  const L = calOTs();
  let h = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i), e = addDays(d, 1);
    if (i === 35 && d.getMonth() !== m) break;
    const its = L.filter(o => overlaps(o, d, e)).sort((a, b) => D(a.inicioPlan) - D(b.inicioPlan));
    const cls = ["day", d.getMonth() !== m && "out", (d.getDay() === 0 || d.getDay() === 6) && "we", dayKey(d) === dayKey(now) && "today", dayKey(d) === dayKey(calSel) && "sel"].filter(Boolean).join(" ");
    h += `<button class="${cls}" data-day="${dayKey(d)}" aria-label="${fmtLong.format(d)}, ${its.length} OT"><span class="dn">${d.getDate()}</span>` +
      its.slice(0, 3).map(o => { const late = ACTIVA(o.estado) && D(o.finPlan) < now;
        return `<span class="chip" style="--b:${esc(bColor(o.brigadaId))}" title="OT ${esc(o.numero)} · ${esc(o.descripcion)}">${late ? '<i class="x"></i>' : ""}<span>${esc(o.numero)} · ${esc(o.sector || "")}</span></span>`; }).join("") +
      (its.length > 3 ? `<span class="more">+${its.length - 3} más</span>` : "") + `</button>`;
  }
  document.getElementById("cal").innerHTML = h;
  document.getElementById("calLegend").innerHTML = S.brigadas.map(b => `<span><i style="background:${esc(b.color)}"></i>${esc(b.nombre)}</span>`).join("") + `<span><i style="background:var(--bad);border-radius:50%;width:7px;height:7px"></i>Atrasada</span>`;
  const its = L.filter(o => overlaps(o, calSel, addDays(calSel, 1))).sort((a, b) => D(a.inicioPlan) - D(b.inicioPlan));
  document.getElementById("dayTitle").textContent = cap(fmtLong.format(calSel));
  document.getElementById("dayCount").textContent = `${its.length} OT`;
  document.getElementById("dayList").innerHTML = its.length ? its.map(otCard).join("") : emptyBox("cal", "Sin OT este día. Usa «Nueva OT» para programar una.");
}

const otTitle = o => `OT ${o.numero}${o.sector ? " · " + o.sector : ""}${brigById(o.brigadaId) ? " · " + brigById(o.brigadaId).nombre : ""}`;

function download(name, text, type) {

/* ======================= CSV ======================= */
const COLS = ["OT", "Descripcion", "Sector", "Brigada", "Empresa", "Prioridad", "Estado", "Inicio plan", "Termino plan", "Inicio real", "Termino real", "Avance %", "Notas"];
function exportCSV() {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`, f = s => s ? s.replace("T", " ") : "";
  const rows = S.ots.map(o => { const b = brigById(o.brigadaId);
    return [o.numero, o.descripcion, o.sector, b?.nombre, b?.empresa, o.prioridad, EST_LABEL[o.estado], f(o.inicioPlan), f(o.finPlan), f(o.inicioReal), f(o.finReal), o.avance, o.notas].map(q).join(";"); });
  download(`OT-${dayKey(new Date())}.csv`, "﻿" + [COLS.map(q).join(";"), ...rows].join("\r\n"), "text/csv;charset=utf-8");
}
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const delim = first.includes("\t") ? "\t" : (first.split(";").length >= first.split(",").length ? ";" : ",");
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function parseDate(s, endOfDay) {
  s = String(s || "").trim(); if (!s) return "";
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}T${m[4] ? pad(m[4]) + ":" + m[5] : endOfDay ? "18:00" : "08:00"}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}T${m[4] ? pad(m[4]) + ":" + m[5] : endOfDay ? "18:00" : "08:00"}`; }
  return "";
}
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9%]/g, "");
const ALIAS = {
  numero: ["ot", "not", "nºot", "numero", "numeroot", "orden", "ordendetrabajo"],
  descripcion: ["descripcion", "trabajo", "detalle", "tarea", "texto", "textobreve"],
  sector: ["sector", "area", "ubicacion", "ubicaciontecnica", "lugar", "planta", "equipo"],
  brigada: ["brigada", "cuadrilla", "grupo", "contratista"],
  empresa: ["empresa", "empresacontratista"],
  prioridad: ["prioridad"], estado: ["estado", "status"],
  inicioPlan: ["inicio", "inicioplan", "fechainicio", "iniplan", "inicioprogramado", "fechainicioplan", "desde"],
  finPlan: ["termino", "terminoplan", "fin", "finplan", "fechatermino", "fechafin", "hasta", "fechaterminoplan", "terminoprogramado"],
  inicioReal: ["inicioreal"], finReal: ["terminoreal", "finreal"], avance: ["avance", "avance%", "%avance"], notas: ["notas", "observaciones", "obs", "comentarios"]
};
function importRows(rows) {
  if (rows.length < 2) return { n: 0, err: "Se necesita una fila de encabezados y al menos una OT." };
  const head = rows[0].map(norm), map = {};
  for (const [k, al] of Object.entries(ALIAS)) { const i = head.findIndex(h => al.map(norm).includes(h)); if (i >= 0) map[k] = i; }
  if (map.numero === undefined) return { n: 0, err: "No encontré la columna de N° de OT (encabezado “OT”)." };
  const estMap = s => { const n = norm(s); return n.startsWith("ejec") || n.startsWith("enejec") || n.startsWith("curso") ? "ejecucion" : n.startsWith("deten") ? "detenida" : n.startsWith("termin") ? "terminada" : n.startsWith("recep") || n.startsWith("cerr") ? "recepcionada" : "planificada"; };
  let nuevas = 0, act = 0;
  for (const r of rows.slice(1)) {
    const g = k => map[k] !== undefined ? (r[map[k]] || "").trim() : "";
    const numero = g("numero"); if (!numero) continue;
    let brigadaId = "";
    const bn = g("brigada");
    if (bn) { let b = S.brigadas.find(x => norm(x.nombre) === norm(bn));
      if (!b) { b = { id: uid(), nombre: bn, empresa: g("empresa"), supervisor: "", telefono: "", integrantes: "", notas: "", color: COLORS[S.brigadas.length % COLORS.length] }; S.brigadas.push(b); }
      brigadaId = b.id; }
    const data = { numero, descripcion: g("descripcion"), sector: g("sector"), prioridad: (["alta", "media", "baja"].find(p => norm(g("prioridad")).startsWith(p)) || "media"),
      estado: g("estado") ? estMap(g("estado")) : "planificada", inicioPlan: parseDate(g("inicioPlan")), finPlan: parseDate(g("finPlan"), true),
      inicioReal: parseDate(g("inicioReal")), finReal: parseDate(g("finReal"), true), avance: parseInt(g("avance")) || 0, notas: g("notas") };
    if (!data.finPlan) data.finPlan = data.inicioPlan;
    const ex = S.ots.find(o => o.numero.trim() === numero);
    if (ex) { for (const k in data) if (data[k] !== "" && !(k === "avance" && !g("avance"))) ex[k] = data[k]; if (bn) ex.brigadaId = brigadaId; act++; }
    else { S.ots.push({ id: uid(), brigadaId, bitacora: [{ t: toLocalInput(new Date()), txt: "Importada desde planilla" }], ...data }); nuevas++; }
  }
  return { n: nuevas + act, nuevas, act };
}

function checkNotifs() {

      const p = await Notification.requestPermission();
      S.ajustes.notif = p === "granted"; save();
      toast(p === "granted" ? "Avisos activados" : "El navegador bloqueó los avisos; habilítalos en la configuración del sitio");
    },
    testNotif: () => { if ("Notification" in window && Notification.permission === "granted") new Notification("Asistente Inspector", { body: "Así se verán los avisos de tus OT." }); else toast("Primero activa los avisos"); },
  }[id];
  if (act) act();
});
document.body.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-ot][role=button]")) { e.preventDefault(); openOT(e.target.dataset.ot); } });
document.body.addEventListener("change", e => {
  const id = e.target.id;
  if (["ajH", "ajD", "ajR"].includes(id)) {
    S.ajustes.horasVence = Math.max(1, +document.getElementById("ajH").value || 24);
    S.ajustes.diasInicio = Math.max(0, +document.getElementById("ajD").value || 0);
    S.ajustes.diasRecepcion = Math.max(0, +document.getElementById("ajR").value || 0);
    persist(); checkNotifs(); toast("Ajustes guardados");
  }
  if (id === "restFile") {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.ots) || !Array.isArray(d.brigadas)) throw 0;
      if (!confirm(`¿Restaurar ${d.ots.length} OT y ${d.brigadas.length} brigadas? Reemplaza los datos actuales.`)) return;
      S = { ...blank(), ...d, ajustes: { ...DEF_AJUSTES, ...(d.ajustes || {}) } }; save(); toast("Respaldo restaurado"); }
      catch (err) { toast("Archivo de respaldo no válido"); } };
    r.readAsText(file);
  }
  if (["fEstado", "fBrig", "fSector"].includes(id)) renderOTs();
  if (id === "calBrig") { calBrig = e.target.value; renderCal(); }
});
document.getElementById("fText").addEventListener("input", renderOTs);
document.getElementById("fab").addEventListener("click", () => {
  const preset = {};
  if (view === "cal") { const s = new Date(calSel); s.setHours(8); const f = new Date(calSel); f.setHours(17); preset.inicioPlan = toLocalInput(s); preset.finPlan = toLocalInput(f); }
  if (view === "cal" && calBrig) preset.brigadaId = calBrig;
  openOT(null, preset);
});
document.getElementById("calPrev").innerHTML = ic("left", "sm");
document.getElementById("calNext").innerHTML = ic("right", "sm");
document.getElementById("calPrev").onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCal(); };
document.getElementById("calNext").onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCal(); };
document.getElementById("calToday").onclick = () => { calSel = startOfDay(new Date()); calMonth = new Date(calSel.getFullYear(), calSel.getMonth(), 1); renderCal(); };
// Tema
const themes = ["auto", "light", "dark"], themeIc = { auto: "auto", light: "sun", dark: "moon" };
function setTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t;
  document.getElementById("themeBtn").innerHTML = ic(themeIc[t]);
  try { localStorage.setItem(KEY + "-theme", t); } catch (e) {}
}
let savedTheme = "auto"; try { savedTheme = localStorage.getItem(KEY + "-theme") || "auto"; } catch (e) {}
setTheme(themes.includes(savedTheme) ? savedTheme : "auto");
document.getElementById("themeBtn").onclick = () => { const cur = document.documentElement.dataset.theme || "auto"; const nx = themes[(themes.indexOf(cur) + 1) % 3]; setTheme(nx); toast("Tema " + { auto: "automático", light: "claro", dark: "oscuro" }[nx]); };
// Reloj y verificación periódica
function tick() { document.getElementById("clock").textContent = fmtHM.format(new Date()); }
hydrateIcons();
tick();
setInterval(() => { tick(); if (!document.querySelector("dialog[open]") && view === "hoy") renderHoy(); checkNotifs(); }, 60000);
renderAll();
</script>
</body>
